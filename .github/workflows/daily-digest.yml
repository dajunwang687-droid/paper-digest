name: Daily Digest (163 Email)

on:
  schedule:
    # GitHub cron 为 UTC；每天北京时间08:17（避开整点拥堵）
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-paper-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install ".[translation]"

      - name: Restore dedup state
        uses: actions/cache/restore@v4
        with:
          path: .paper-digest-state
          key: paper-digest-state-${{ github.run_id }}
          restore-keys: |
            paper-digest-state-

      - name: Materialize private config
        env:
          PAPER_DIGEST_CONFIG_TOML: ${{ secrets.PAPER_DIGEST_CONFIG_TOML }}
        run: |
          test -n "$PAPER_DIGEST_CONFIG_TOML" || { echo "PAPER_DIGEST_CONFIG_TOML secret is missing" >&2; exit 1; }
          printf '%s\n' "$PAPER_DIGEST_CONFIG_TOML" > config.toml

      - name: Cache Chinese translation model
        uses: actions/cache@v4
        with:
          path: .paper-digest-models
          key: paper-digest-translation-argos-en-zh-1.9-433e7c4f034d

      - name: Download Chinese translation model
        run: python -m tools.install_translation_model --config config.toml

      - name: Generate and deliver digest
        env:
          PAPER_DIGEST_SMTP_PASSWORD: ${{ secrets.PAPER_DIGEST_SMTP_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python -m paper_digest --config config.toml

      - name: Save dedup state
        if: ${{ success() && hashFiles('.paper-digest-state/**') != '' }}
        uses: actions/cache/save@v4
        with:
          path: .paper-digest-state
          key: paper-digest-state-${{ github.run_id }}

      - name: Upload report for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-paper-digest
          path: output/
          if-no-files-found: ignore
          retention-days: 7
